<style id="page-css">
/* Layout: one 1040px column — header with stats, sticky tab bar, then one panel per tab. Day cards are collapsible rows grouped by week. */
:root {
  --bg: #F2F5F4; --surface: #FFFFFF; --sunk: #E7EDEB; --line: #D3DCD9;
  --fg: #13201C; --muted: #56655F;
  --accent: #0A7462; --accent-ink: #FFFFFF; --accent-soft: #D3ECE5;
  --w: #5842B2; --w-soft: #E6E0F7;
  --warn: #A9450B; --warn-soft: #FAE4D5; --ok: #1D7337;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1311; --surface: #141C1A; --sunk: #1A2421; --line: #283431;
  --fg: #E1E9E6; --muted: #93A29D;
  --accent: #3CC3A9; --accent-ink: #05201A; --accent-soft: #15382F;
  --w: #A893F1; --w-soft: #282244;
  --warn: #F09E62; --warn-soft: #3A2315; --ok: #5DCB7F;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1311; --surface: #141C1A; --sunk: #1A2421; --line: #283431;
  --fg: #E1E9E6; --muted: #93A29D;
  --accent: #3CC3A9; --accent-ink: #05201A; --accent-soft: #15382F;
  --w: #A893F1; --w-soft: #282244;
  --warn: #F09E62; --warn-soft: #3A2315; --ok: #5DCB7F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Header */
.top { padding-block: 28px 18px; display: grid; gap: 18px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.title-row { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; justify-content: space-between; }
.title-row h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.goal { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); }
.score { font-family: var(--font-mono); font-weight: 600; color: var(--fg); background: var(--accent-soft); padding: 2px 10px; border-radius: 999px; }
.score b { color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.field input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-family: var(--font-mono); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.save { border: 0; background: transparent; padding: 4px 0; font-size: 13px; color: var(--muted); cursor: default; display: inline-flex; gap: 6px; align-items: center; }
.save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.save[data-kind="ok"]::before { background: var(--ok); }
.save[data-kind="pending"]::before, .save[data-kind="saving"]::before { background: var(--warn); }
.save[data-kind="pending"] { cursor: pointer; color: var(--fg); }
.save[data-kind="err"] { color: var(--warn); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--muted); }
.stat.warn .v { color: var(--warn); }
.bar { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s; }
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 12px 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; color: var(--warn); }
main { padding-block: 22px 60px; }
.panel { display: grid; gap: 22px; }
.lead { color: var(--muted); max-width: 68ch; margin: 0; }

/* Routine */
.routine { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slotcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.slotcard h3 { font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.slotcard h3 span { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 500; }
.slotcard ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.slotcard li::marker { color: var(--muted); }
@media (max-width: 640px) { .routine { grid-template-columns: 1fr; } }

/* Weeks & days */
.week { display: grid; gap: 8px; }
.week-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.week-h h2 { font-size: 19px; font-weight: 700; }
.week-h .m { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.day.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 76px 74px minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 12px 14px; }
.day > summary::-webkit-details-marker { display: none; }
.d-num { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
.d-date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.d-title { font-weight: 600; min-width: 0; }
.d-title .today { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
.d-tags { display: flex; gap: 4px; }
.tag { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.tag.S { background: var(--accent-soft); color: var(--accent); }
.tag.W { background: var(--w-soft); color: var(--w); }
.d-prog { font-family: var(--font-mono); font-size: 13px; color: var(--muted); min-width: 44px; text-align: right; }
.day.is-done .d-prog { color: var(--ok); font-weight: 600; }
.day.is-done .d-num::after { content: " ✓"; color: var(--ok); }
.d-body { border-top: 1px solid var(--line); padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.slot h3 { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.slot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.task { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
.task:hover { background: var(--sunk); }
.task input { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
.task input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.mins { font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; color: var(--accent); margin-right: 4px; }
.d-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip b { font-weight: 600; }
@media (max-width: 640px) {
  .day > summary { grid-template-columns: auto auto 1fr auto; }
  .d-title { grid-column: 1 / -1; grid-row: 2; }
  .d-tags { grid-column: 3; justify-self: end; }
  .d-body { grid-template-columns: 1fr; }
}

/* Vocab */
.topics { display: grid; gap: 14px; }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; scroll-margin-top: 70px; }
.topic.flash { box-shadow: 0 0 0 2px var(--accent); }
.topic-h { display: flex; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }
.topic-h h3 { font-size: 18px; font-weight: 700; }
.topic-h .vi { color: var(--muted); font-size: 14px; }
.learned { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.learned input { accent-color: var(--accent); }
.learned:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.words { display: grid; }
.w-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.w-row:first-child { border-top: 0; }
.w-word { font-weight: 600; }
.w-word i { font-style: normal; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-left: 6px; font-weight: 500; }
.w-col { color: var(--muted); font-size: 14px; }
.colloc { margin: 0; color: var(--fg); }
.sub-h { font-size: 15px; font-weight: 700; margin-top: 8px; }
@media (max-width: 640px) { .w-row { grid-template-columns: 1fr; gap: 0; } }

/* Phrases & grammar */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h3 { font-size: 17px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.card h3 .mono { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.card p { margin: 0; }
.ph { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ph.num { counter-reset: s; }
.ph.num li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; }
.ph.num li::before { content: counter(s); font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-size: 13px; padding-top: 2px; }
.ph .en { display: block; font-weight: 500; }
.ph .vi { display: block; font-size: 13.5px; color: var(--muted); }
.ph.num li > div { min-width: 0; }
.blank { color: var(--accent); font-weight: 600; }
.sample { background: var(--sunk); border-radius: 8px; padding: 12px 14px; font-size: 14.5px; }
.sample .lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.sample p + p { margin-top: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 13.5px; background: var(--sunk); border-radius: 6px; padding: 3px 9px; }
.ex { display: grid; gap: 4px; font-size: 14.5px; }
.ex .bad { color: var(--warn); }
.ex .bad::before { content: "✗ "; font-weight: 700; }
.ex .good { color: var(--ok); }
.ex .good::before { content: "✓ "; font-weight: 700; }
.use { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
@media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }

/* Exam tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
td.q { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
td.t { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.callout { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; }
.callout h3 { font-size: 17px; }
.callout ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* Errors */
.err-form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 1fr 1fr 170px auto; gap: 10px; align-items: end; }
.err-form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.err-form input, .err-form select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 14.5px; width: 100%; }
@media (max-width: 760px) { .err-form { grid-template-columns: 1fr; } }
.errs { display: grid; gap: 10px; }
.err { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.err.hot { border-color: var(--warn); background: linear-gradient(var(--warn-soft), var(--warn-soft)) left / 4px 100% no-repeat, var(--surface); }
.err .cnt { font-family: var(--font-mono); font-size: 22px; font-weight: 600; text-align: center; line-height: 1; }
.err .cnt small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 3px; }
.err.hot .cnt { color: var(--warn); }
.err .txt { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.err .alert { font-size: 12px; font-weight: 700; color: var(--warn); letter-spacing: .04em; text-transform: uppercase; }
.err .meta { font-size: 12px; color: var(--muted); }
.err .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.err .acts .btn { padding: 6px 10px; font-size: 13px; }
.btn.danger { color: var(--warn); }
.btn.danger.confirm { background: var(--warn); color: var(--surface); border-color: var(--warn); }
@media (max-width: 560px) { .err { grid-template-columns: 48px minmax(0, 1fr); } .err .acts { grid-column: 1 / -1; justify-content: start; } }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 20px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

function updateProgress() {
  var all = 0, done = 0, daysDone = 0;
  WEEKS.forEach(function (w) {
    var wa = 0, wd = 0;
    for (var n = w.from; n <= w.to; n++) {
      var ids = tasksOf(n), c = doneCount(ids);
      wa += ids.length; wd += c;
      var el = $("#dp-" + n); if (el) el.textContent = c + "/" + ids.length;
      var card = $("#day-" + n); if (card) card.classList.toggle("is-done", c === ids.length);
      if (c === ids.length) daysDone++;
    }
    all += wa; done += wd;
    var m = $("#wk-" + w.n); if (m) m.textContent = wd + "/" + wa + " nhiệm vụ";
    var b = $("#wkbar-" + w.n); if (b) b.style.width = (wa ? wd / wa * 100 : 0) + "%";
  });
  var pct = all ? Math.round(done / all * 100) : 0;
  $("#st-pct").textContent = pct + "%";
  $("#st-tasks").textContent = done + "/" + all + " nhiệm vụ";
  $("#st-bar").style.width = pct + "%";
  $("#st-days").textContent = daysDone + "/30";
  var tn = todayN();
  $("#st-today").textContent = tn < 1 ? "Bắt đầu sau " + (1 - tn) + " ngày" : tn > 30 ? "Đã qua 30 ngày" : "Hôm nay: Ngày " + tn + " · " + fmt(dateOf(tn));
  var learned = NEW_ORDER.concat(OLD_ORDER).filter(function (id) { return state.vocab[id]; }).length;
  $("#st-vocab").textContent = learned + "/26";
  var hot = state.errors.filter(function (e) { return e.count >= 3; }).length;
  $("#st-err").textContent = hot;
  $("#st-err-box").classList.toggle("warn", hot > 0);
  $("#tab-err-n").textContent = hot ? "⚠" + hot : "";
}

  var js = document.getElementById("page-js").textContent;
  var json = JSON.stringify(state).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + resetBlock() + "</style></head><body>" +
    HEAD_HTML + '<style id="page-css">' + css + '</style>\n<div id="app"></div>\n<script type="application/json" id="sw-state">' + json + '<\/script>\n<script id="page-js">' + js + "<\/script>\n</body></html>";
}
function commit() {
  state.updated = Date.now(); acted = true; dirty = true;
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  updateProgress();
  if (!art || readOnly) { setStatus("ok", "Đã lưu lúc " + hhmm()); return; }
  setStatus("pending", "Sẽ lưu sau vài giây…");
  clearTimeout(timer); timer = setTimeout(flush, 3000);
}
function flush() {
  clearTimeout(timer);
  if (!dirty || saving || !art || readOnly) return;
  saving = true; setStatus("saving", "Đang lưu…"); stashUI();
  try { sessionStorage.setItem(SS + "-saved", hhmm()); } catch (e) {}
  art.publish(buildDoc()).then(function () { dirty = false; setStatus("ok", "Đã lưu"); }, function (e) {
    var c = e && e.code;
    try { sessionStorage.removeItem(SS + "-saved"); } catch (_) {}
    if (c === "conflict") setStatus("pending", "Có bản mới hơn, đang tải lại");
    else if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].indexOf(c) >= 0) { readOnly = true; setStatus("local", "Chỉ xem · lưu trên trình duyệt này"); }
    else if (c === "rate_limited") { setStatus("pending", "Lưu hơi dày, sẽ thử lại"); timer = setTimeout(flush, 20000); }
    else if (!retried) { retried = true; setStatus("pending", "Đang thử lưu lại…"); timer = setTimeout(flush, 2000 + Math.random() * 2000); }
    else setStatus("err", "Chưa lưu được · đã giữ trên trình duyệt này");
  }).then(function () { saving = false; });
}

/* ---------- Events ---------- */
function bind() {
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.task) { if (t.checked) state.done[t.dataset.task] = true; else delete state.done[t.dataset.task]; commit(); }
    else if (t.dataset.vocab) { if (t.checked) state.vocab[t.dataset.vocab] = true; else delete state.vocab[t.dataset.vocab]; commit(); }
    else if (t.id === "start-date" && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) {
      var open = new Set(openDays()); state.start = t.value; renderPlan(open); commit();
    }
  });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tab) { setTab(b.dataset.tab); window.scrollTo(0, 0); }
    else if (b.id === "go-today") {
      var n = Math.min(30, Math.max(1, todayN())); setTab("plan");
      var d = $("#day-" + n); if (d) { d.open = true; d.scrollIntoView({ block: "center" }); }
    }
    else if (b.id === "save") { if (dirty && art && !readOnly) { acted = true; flush(); } }
    else if (b.dataset.jump) {
      setTab("vocab"); var el = $("#topic-" + b.dataset.jump);
      if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("flash"); setTimeout(function () { el.classList.remove("flash"); }, 1600); }
    }
    else if (b.dataset.inc) {
      state.errors.forEach(function (x) { if (x.id === b.dataset.inc) { x.count++; x.at = Date.now(); } });
      pendingDelete = null; renderErrors(); commit();
    }
    else if (b.dataset.del) {
      if (pendingDelete === b.dataset.del) { state.errors = state.errors.filter(function (x) { return x.id !== b.dataset.del; }); pendingDelete = null; renderErrors(); commit(); }
      else { pendingDelete = b.dataset.del; renderErrors(); setTimeout(function () { if (pendingDelete) { pendingDelete = null; renderErrors(); } }, 4000); }
    }
  });
  app.addEventListener("submit", function (e) {
    if (e.target.id !== "err-form") return;
    e.preventDefault();
    var w = $("#err-wrong").value.trim(); if (!w) return;
    state.errors.push({ id: "e" + Date.now().toString(36), wrong: w, right: $("#err-right").value.trim(), type: $("#err-type").value, count: 1, at: Date.now() });
    renderErrors(); commit(); $("#err-wrong").focus();
  });
  /* Sao lưu / khôi phục tiến độ bằng file JSON (để chuyển sang máy khác) */
  app.addEventListener("click", function (e) {
    if (!e.target.closest("#export")) return;
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "toeic-sw30-tien-do-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    setStatus("ok", "Đã tải file sao lưu");
  });
  app.addEventListener("change", function (e) {
    if (e.target.id !== "import-file" || !e.target.files[0]) return;
    var f = e.target.files[0], rd = new FileReader();
    rd.onload = function () {
      try {
        var s = JSON.parse(rd.result);
        if (!s || typeof s.done !== "object" || !Array.isArray(s.errors)) throw new Error("bad");
        s.updated = Date.now();
        localStorage.setItem(LS, JSON.stringify(s));
        location.reload();
      } catch (err) { setStatus("err", "File không đúng định dạng sao lưu"); }
    };
    rd.readAsText(f);
  });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden" && dirty && acted) flush(); });
}

/* ---------- Boot ---------- */
renderShell();
renderPlan(ui.open ? new Set(ui.open) : null);
renderVocab();
renderErrors();
bind();
setTab(ui.tab);
updateProgress();
if (ui.y) requestAnimationFrame(function () { window.scrollTo(0, ui.y); });
(function () {
  var just = null; try { just = sessionStorage.getItem(SS + "-saved"); sessionStorage.removeItem(SS + "-saved"); } catch (e) {}
  if (dirty && !window.claude) setStatus("ok", "Đã khôi phục tiến độ");
  else if (dirty) setStatus("pending", "Có thay đổi chưa lưu");
  else if (just) setStatus("ok", "Đã lưu lúc " + just);
  else setStatus("idle", "Tự động lưu");
})();
var use = window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null);
Promise.resolve(use).then(function (a) {
  art = a;
  if (!art && !dirty) setStatus("local", "Lưu trên trình duyệt này");
  if (art && dirty && acted) { clearTimeout(timer); timer = setTimeout(flush, 3000); }
}, function () {});
})();
</script>
